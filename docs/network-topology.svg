<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Home infrastructure network topology</title>
  <desc id="desc">Current physical links and planned VLAN migrations for the RB5009 router, FRITZ!Box, Synology NAS, Aruba access point, wired clients, Raspberry Pis, Wi-Fi networks, IoT devices, and home-cloud virtual machines.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#152238" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-planned" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #5d687a; }
      .section-title { font-size: 18px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; }
      .small { font-size: 12px; fill: #5d687a; }
      .tiny { font-size: 11px; fill: #687386; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .panel { fill: #ffffff; stroke: #cbd4e1; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .node { fill: #ffffff; stroke: #9ba8ba; stroke-width: 1.5; rx: 12; }
      .core { fill: #14213d; stroke: #14213d; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .core-text { fill: #ffffff; }
      .port { fill: #223251; stroke: #61708a; stroke-width: 1; rx: 5; }
      .port-text { fill: #eaf0fb; font-size: 11px; }
      .wan { stroke: #d24b4b; stroke-width: 4; fill: none; }
      .physical { stroke: #4e5d73; stroke-width: 3; fill: none; }
      .lacp { stroke: #4e5d73; stroke-width: 3; fill: none; }
      .planned { stroke: #7c3aed; stroke-width: 2.5; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrow-planned); }
      .v1 { stroke: #6b7280; }
      .v100 { stroke: #1976d2; }
      .v200 { stroke: #e48900; }
      .v300 { stroke: #2e9d65; }
      .v400 { stroke: #7c3aed; }
      .pill { rx: 8; stroke-width: 1; }
      .pill-text { font-size: 11px; font-weight: 700; }
      .p1 { fill: #f1f3f5; stroke: #9ca3af; }
      .p100 { fill: #e5f2ff; stroke: #1976d2; }
      .p200 { fill: #fff1d7; stroke: #e48900; }
      .p300 { fill: #e5f7ee; stroke: #2e9d65; }
      .p400 { fill: #f0e9ff; stroke: #7c3aed; }
      .current-chip { fill: #e8f5ec; stroke: #4d9b65; }
      .planned-chip { fill: #f1ebff; stroke: #8b5cf6; }
      .warn-chip { fill: #fff4db; stroke: #d59100; }
      .divider { stroke: #d8dee8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1800" height="1260" fill="#f5f7fb"/>

  <!-- Header -->
  <text x="46" y="48" class="title">Home infrastructure · network topology</text>
  <text x="46" y="75" class="subtitle">Current production wiring with planned IoT and home-cloud segmentation · RouterOS 7.24.4 · 2026-09-29</text>
