    <line x1="0" y1="10" x2="48" y2="10" class="physical"/>
    <text x="58" y="15" class="small">Current link</text>
    <line x1="0" y1="39" x2="48" y2="39" class="planned"/>
    <text x="58" y="44" class="small">Planned migration</text>
  </g>

