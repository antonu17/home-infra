      <rect x="304" y="0" width="68" height="46" class="port"/><text x="338" y="20" text-anchor="middle" class="port-text">ether5</text><text x="338" y="36" text-anchor="middle" class="port-text">Pi #2</text>
      <rect x="380" y="0" width="68" height="46" class="port"/><text x="414" y="20" text-anchor="middle" class="port-text">ether6</text><text x="414" y="36" text-anchor="middle" class="port-text">Pi #1</text>
      <rect x="456" y="0" width="68" height="46" class="port"/><text x="490" y="20" text-anchor="middle" class="port-text">ether7</text><text x="490" y="36" text-anchor="middle" class="port-text">Aruba</text>
