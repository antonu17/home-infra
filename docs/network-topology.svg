      <rect x="76" y="0" width="68" height="46" class="port"/><text x="110" y="20" text-anchor="middle" class="port-text">ether2</text><text x="110" y="36" text-anchor="middle" class="port-text">Synology</text>
      <rect x="152" y="0" width="68" height="46" class="port"/><text x="186" y="20" text-anchor="middle" class="port-text">ether3</text><text x="186" y="36" text-anchor="middle" class="port-text">TV</text>
