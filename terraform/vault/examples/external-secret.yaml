# Acceptance example only; no existing workload Secret is adopted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-connection-check
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: home-cloud-vault
    kind: SecretStore
  target:
    name: vault-connection-check
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: connection-check
      remoteRef:
        key: home-assistant/connection-check
        property: value
