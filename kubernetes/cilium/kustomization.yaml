apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Protect CNI, routing and shared CRDs without changing pod-template annotations.
transformers:
  - retention.yaml

resources:
  - ./manifests
  - ./gateway-api

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.20.2
    releaseName: cilium
    namespace: kube-system
    includeCRDs: true
    valuesFile: values.yaml

# Maintenance of an existing installation: retain live Helm-generated TLS data.
# Offline Helm cannot look up existing certificates. See README.md for bootstrap.
patches:
  # Preserve gRPC-Web for Argo's HTTP backend on every Gateway using this class.
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: GatewayClass
      name: cilium
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: cilium
      spec:
        parametersRef:
          group: cilium.io
          kind: CiliumGatewayClassConfig
          name: cilium-grpc-web
          namespace: kube-system

  - target:
      version: v1
      kind: Secret
      labelSelector: cilium.io/helm-template-non-idempotent=true
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: ignored
  - target:
      version: v1
      kind: ConfigMap
      labelSelector: cilium.io/helm-template-non-idempotent=true
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ignored

  # Retain the existing Helm-managed operator readiness delay during maintenance.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cilium-operator
      namespace: kube-system
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cilium-operator
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: cilium-operator
                readinessProbe:
                  initialDelaySeconds: null

  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: ignored
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
