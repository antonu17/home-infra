apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: playit
  namespace: argocd
spec:
  description: Playit public Minecraft and voice-chat tunnel agent
  sourceRepos:
    - https://github.com/antonu17/home-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: playit
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playit
  namespace: argocd
spec:
  project: playit
  source:
    repoURL: https://github.com/antonu17/home-infra.git
    targetRevision: main
    path: kubernetes/apps/playit
  destination:
    server: https://kubernetes.default.svc
    namespace: playit
