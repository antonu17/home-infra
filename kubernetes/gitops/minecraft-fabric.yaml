apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: minecraft-fabric
  namespace: argocd
spec:
  description: Crafty panel for Fabric Minecraft 26.3 with retained Synology storage
  sourceRepos:
    - https://github.com/antonu17/home-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: minecraft
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft-fabric
  namespace: argocd
spec:
  project: minecraft-fabric
  source:
    repoURL: https://github.com/antonu17/home-infra.git
    targetRevision: main
    path: kubernetes/apps/minecraft-fabric
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
