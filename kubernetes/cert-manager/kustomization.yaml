apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Review candidate: cert-manager 1.21 support currently ends at Kubernetes 1.36.
# See docs/cert-manager.md before syncing on this cluster's 1.37.1.
resources:
  - namespace.yaml
  - config/vault-store.yaml
  - config/route53-external-secret.yaml
  - config/clusterissuers.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.2
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesFile: values.yaml
