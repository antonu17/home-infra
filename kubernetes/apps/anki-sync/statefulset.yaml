apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: anki-sync
  namespace: anki-sync
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: anki-sync
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anki-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anki-sync
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage.home.antonu.org/synology-iscsi
                    operator: In
                    values:
                      - "true"
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anki-sync
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - >-
              pip install --no-cache-dir anki &&
              exec python -c 'from anki._backend import RustBackend; RustBackend.syncserver()'
          env:
            - name: SYNC_USER1
              valueFrom:
                secretKeyRef:
                  name: anki-sync-credentials
                  key: SYNC_USER1
            - name: SYNC_PORT
              value: "8088"
            - name: SYNC_HOST
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /root/.syncserver
              subPath: syncserver
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anki-sync-data
