apiVersion: v1
kind: PersistentVolume
metadata:
  name: deconz-local-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: deconz
    name: deconz-local-data
  local:
    path: /var/mnt/deconz
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-worker-03]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deconz-local-data
  namespace: deconz
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: deconz-local-data
  resources:
    requests:
      storage: 5Gi
