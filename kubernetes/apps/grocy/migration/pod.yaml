# Operator-owned temporary import pod, intentionally excluded from Argo.
apiVersion: v1
kind: Pod
metadata:
  name: grocy-migration
  namespace: grocy
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: storage.home.antonu.org/synology-iscsi
                operator: In
                values: ["true"]
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: migration
      image: python:3.12-slim
      command: [/bin/sh, -ec, "sleep 86400"]
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE, FOWNER]
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: grocy-data
