apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-fabric
  namespace: minecraft
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Stop the old server before starting another process on the same world.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft-fabric
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft-fabric
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        storage.home.antonu.org/synology-iscsi: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.9.2-java21
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Applying this manifest accepts https://aka.ms/MinecraftEULA.
            # Apply only after reviewing and agreeing to the EULA.
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: FABRIC
            # Keep game, loader, mods and Java versions compatible.
            - name: VERSION
              value: "1.21.1"
            - name: FABRIC_LOADER_VERSION
              value: "0.16.14"
            - name: FABRIC_LAUNCHER_VERSION
              value: "1.0.3"
            - name: INIT_MEMORY
              value: 1G
            - name: MAX_MEMORY
              value: 2G
            - name: ONLINE_MODE
              value: "TRUE"
            - name: ENABLE_RCON
              value: "FALSE"
            - name: ENABLE_QUERY
              value: "FALSE"
            - name: MAX_PLAYERS
              value: "10"
            - name: VIEW_DISTANCE
              value: "8"
            - name: SIMULATION_DISTANCE
              value: "6"
            - name: MOTD
              value: Homelab Fabric
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
            timeoutSeconds: 3
          # No liveness restart loop during long world saves or GC pauses.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              # JVM heap must leave room for native memory and libraries.
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
