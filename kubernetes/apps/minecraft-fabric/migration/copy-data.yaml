# Operator-run Pod; mount NAS read-only and local target read-write.
apiVersion: v1
kind: Pod
metadata:
  name: crafty-storage-copy
  namespace: minecraft
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: talos-worker-03
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: copy
      image: registry.gitlab.com/crafty-controller/crafty-4:4.10.8
      command: [python3, -c]
      args:
        - |
          from pathlib import Path
          import hashlib, json, os, shutil
          source, target = Path("/source"), Path("/target")
          if any(target.iterdir()):
              raise SystemExit("Target is not empty; refusing overwrite/retry")
          if not (source / "config/db/crafty.sqlite").is_file() or not (source / "servers").is_dir():
              raise SystemExit("Source is not a populated Crafty data volume")
          def inventory(root):
              result = {}
              for path in root.rglob("*"):
                  rel = str(path.relative_to(root))
                  if path.is_symlink():
                      result[rel] = ["symlink", os.readlink(path)]
                  elif path.is_file():
                      h = hashlib.sha256()
                      with path.open("rb") as f:
                          for block in iter(lambda: f.read(1024 * 1024), b""):
                              h.update(block)
                      result[rel] = ["file", path.stat().st_size, h.hexdigest()]
                  elif path.is_dir():
                      result[rel] = ["directory"]
                  else:
                      raise SystemExit("Unsupported source file type")
              return result
          before = inventory(source)
          shutil.copytree(source, target, dirs_exist_ok=True, symlinks=True)
          if before != inventory(source) or before != inventory(target):
              raise SystemExit("Copy verification failed or source changed; no completion marker written")
          (target / ".migration-complete.json").write_text(json.dumps({
              "source": "minecraft/crafty-data", "target": "minecraft/crafty-local-data",
              "verified_entries": len(before)
          }))
          os.sync()
          print("Verified copy complete:", len(before), "entries; completion marker written")
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "1", memory: 512Mi}
      volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: target
          mountPath: /target
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: crafty-data
        readOnly: true
    - name: target
      persistentVolumeClaim:
        claimName: crafty-local-data
