apiVersion: v1
kind: Service
metadata:
  name: minecraft-fabric
  namespace: minecraft
  annotations:
    lbipam.cilium.io/ips: "10.40.0.20"
    external-dns.kubernetes.io/hostname: minecraft.home.antonu.org
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  # Trusted Home and Cloud sources; add remote sources only after review.
  loadBalancerSourceRanges:
    - 192.168.100.0/24
    - 192.168.40.0/24
  selector:
    app.kubernetes.io/name: minecraft-fabric
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
    - name: voicechat
      port: 24454
      targetPort: voicechat
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: crafty
  namespace: minecraft
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minecraft-fabric
  ports:
    - name: panel-https
      port: 8443
      targetPort: panel-https
      protocol: TCP
    - name: panel-http
      port: 8080
      targetPort: panel-http
      protocol: TCP
      appProtocol: http
