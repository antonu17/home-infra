apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crafty
  namespace: minecraft
spec:
  parentRefs:
    - name: home-cloud
      namespace: gateway
      sectionName: https
  hostnames: [crafty.home.antonu.org]
  rules:
    - timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: crafty
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crafty-redirect
  namespace: minecraft
spec:
  parentRefs:
    - name: home-cloud
      namespace: gateway
      sectionName: http
  hostnames: [crafty.home.antonu.org]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
