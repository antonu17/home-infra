apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playit-agent
  namespace: playit
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: home-cloud-vault
    kind: SecretStore
  target:
    name: playit-agent
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: playit/agent
        property: SECRET_KEY
