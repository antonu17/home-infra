apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-local-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: home-assistant
    name: home-assistant-local-data
  local:
    path: /var/mnt/home-assistant
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-worker-02]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-local-data
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: home-assistant-local-data
  resources:
    requests:
      storage: 5Gi
---
