apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  serviceName: matter-server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
    spec:
      # Upstream requires the host network for IPv6 and mDNS device reachability.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: STORAGE_PATH
              value: /data
            - name: LISTEN_ADDRESS
              value: 0.0.0.0
            - name: LOG_LEVEL
              value: info
            # Preserve the controller identity recorded in the restored HAOS
            # Matter fabric. Without these values Matter.js creates a new,
            # empty 0xfff1/1 fabric instead of migrating the existing one.
            - name: VENDOR_ID
              value: "0x134b"
            - name: FABRIC_ID
              value: "2"
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
