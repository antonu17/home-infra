apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - root.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.9.6
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    valuesFile: values.yaml

