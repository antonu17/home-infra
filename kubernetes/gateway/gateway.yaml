apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home-cloud
  namespace: gateway
spec:
  gatewayClassName: cilium
  # Stable DNS target from the existing pool; check for collision before sync.
  addresses:
    - type: IPAddress
      value: 10.40.0.10
  listeners:
    - name: http
      hostname: "*.home.antonu.org"
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [adsb, anki-sync, argocd, deconz, gateway, grocy, home-assistant, kube-system, mealie]
        kinds:
          - kind: HTTPRoute
    - name: https
      hostname: "*.home.antonu.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: home-antonu-org-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [adsb, anki-sync, argocd, deconz, gateway, grocy, home-assistant, kube-system, mealie]
        kinds:
          - kind: HTTPRoute
    - name: deconz-websocket
      # Keep hostname specificity equal to the 443 listener so the exact
      # deCONZ hostname does not suppress its UI route on that listener.
      hostname: "*.home.antonu.org"
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: home-antonu-org-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: deconz
        kinds:
          - kind: HTTPRoute
