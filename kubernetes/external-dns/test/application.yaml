# Optional acceptance test. NOT included in the GitOps root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-acceptance
  namespace: argocd
spec:
  project: home-cloud
  source:
    repoURL: https://github.com/antonu17/home-infra.git
    targetRevision: main
    path: kubernetes/external-dns/test/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
