# Argo-managed alongside ESO; operator syncs this package, no separate apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-token-reviewer
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-token-reviewer
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-reviewer
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-token-reviewer
subjects:
  - kind: ServiceAccount
    name: vault-token-reviewer
    namespace: external-secrets

---
# Persistent credential for NAS-hosted Vault; token data is generated by Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token-reviewer
  namespace: external-secrets
  annotations:
    kubernetes.io/service-account.name: vault-token-reviewer
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: kubernetes.io/service-account-token
